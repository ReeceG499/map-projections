<!DOCTYPE html>
<html>
<head>
    <title>Map Projection Explorer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="app" class="visualization">
        <div class="globe-section">
            <h3>Globe</h3>
            <div id="map-canvas"></div>
        </div>

        <div class="map-section">
        <h3>Projection View</h3>
        
        <div class="control-group">
            <label for="projection-select">Projection</label>
            <select id="projection-select">
                <option value="equirectangular">Equirectangular</option>
                <option value="mercator">Mercator</option>
                <option value="mollweide">Mollweide</option>
                <option value="bonne">Bonne</option>
            </select>
        </div>
        
        <canvas id="projection-canvas"></canvas>

        <div class="control-group"> 
            <label for="toggleGraticule">Show Graticule</label>
            <input type="checkbox" id="toggleGraticule" checked> 
        </div>
    </div>
    </div>

    <!-- Load app as ES module; app will import globe and projections modules -->
    <script type="module" src="js/app.js"></script>

    <footer>
        <div class="footer-content">
            <div class="projection-info" id="projection-info-footer" style="display: none;">
                <h3 id="projection-name">Select a Projection</h3>
                
                <div class="info-grid">
                    <div class="info-card">
                        <h4>About This Projection</h4>
                        <p id="projection-description">Choose a projection from the dropdown to see information about it here.</p>
                    </div>
                    
                    <div class="info-card">
                        <h4>Best Uses</h4>
                        <p id="projection-uses">Common applications will appear here when you select a projection.</p>
                    </div>
                </div>
            </div>
            
            <div class="footer-newsletter">
                <h4>other things i do</h4>
                <a href="https://substack.com/@reecegarthwaite?utm_campaign=profile&utm_medium=profile-page" class="substack-link" target="_blank">
                    <img src="textures/substack.png" alt="Substack" width="18" height="18">
                    Subscribe on Substack
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
